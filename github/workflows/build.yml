name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable

      - name: Fix s_translation intl version
        run: |
          sed -i 's/intl: \^0.19.0/intl: ^0.20.2/' packages/s_translation/pubspec.yaml
          cat packages/s_translation/pubspec.yaml | grep intl

      - name: Install Melos
        run: |
          dart pub global activate melos
          export PATH="$PATH:$HOME/.pub-cache/bin"
          melos bootstrap

      - name: Build APK
        run: |
          cd apps/super_up_app
          export PATH="$PATH:$HOME/.pub-cache/bin"
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperUp-APK
          path: apps/super_up_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
