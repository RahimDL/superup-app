name: super_up
version: 3.0.0+90
publish_to: none
description: Super up app is social media chat system whats app clone

environment:
  sdk: ">=3.0.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  v_chat_message_page:
    path: ../../packages/v_chat_message_page
  v_chat_sdk_core:
    path: ../../packages/v_chat_sdk_core
  v_chat_room_page:
    path: ../../packages/v_chat_room_page
  v_chat_media_editor:
    path: ../../packages/v_chat_media_editor
  v_chat_firebase_fcm:
    path: ../../packages/v_chat_firebase_fcm
  v_chat_receive_share:
    path: ../../packages/v_chat_receive_share
  v_chat_call_service:
    path: ../../packages/v_chat_call_service
  super_up_core:
    path: ../../packages/super_up_core
  s_translation:
    path: ../../packages/s_translation

  cupertino_icons: ^1.0.8
  badges: ^3.1.2
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  http: ^1.4.0
  email_validator: ^3.0.0
  touchable_opacity: ^1.2.0
  window_manager: ^0.4.3
  package_info_plus: ^8.3.1
  get_it: ^8.0.3
  url_strategy: ^0.3.0
  path_provider: ^2.1.5
  responsive_builder: ^0.7.1
  version: ^3.0.2
  responsive_framework: ^1.5.1
  universal_html: ^2.3.0
  flutter_native_splash: ^2.4.4
  chopper: ^8.0.3
  uuid: ^4.5.1
  logging: ^1.3.0
  modal_bottom_sheet: ^3.0.0
  v_platform: ^2.1.5
  v_chat_bubbles: ^1.2.6
  google_fonts: ^6.2.1
  google_mobile_ads: ^5.1.0
  loadmore: ^2.1.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  enum_to_string: ^2.2.1
  adaptive_dialog: ^2.4.2
  pinput: ^5.0.1
  flutter_local_notifications: ^18.0.1
  place_picker_google: ^0.0.20
  v_story_viewer: ^2.0.2
  hexcolor: ^3.0.1
  background_downloader: ^8.9.5
  open_filex: ^4.6.0
  file_sizes: ^1.0.6
  mime: ^2.0.0
  permission_handler: ^11.4.0
  easy_image_viewer: ^1.5.1
  wechat_assets_picker: ^9.5.1
  wechat_camera_picker: ^4.3.7
  video_player: ^2.9.5
  audioplayers: ^6.1.0
  record: ^5.2.1

dependency_overrides:
  meta: ^1.16.0
  google_mobile_ads: ^5.1.0
  google_fonts: ^6.2.1
  share_plus: ^10.1.4
  package_info_plus: ^8.3.1
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.4.0
  record: ^5.2.1

dev_dependencies:
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  chopper_generator: ^8.0.3
  flutter_launcher_icons: ^0.14.3

flutter:
  assets:
    - assets/connect_web.png
    - assets/ic_addphoto.png
    - assets/logo.png
    - assets/logo_stors.png
    - assets/logo_windows.png
    - assets/message/
  uses-material-design: true
  generate: true

  fonts:
    - family: SF Pro Text
      fonts:
        - asset: assets/fonts/SF-Pro-Text-Regular.otf
          weight: 400
        - asset: assets/fonts/SF-Pro-Text-Bold.otf
          weight: 700

    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700

flutter_icons:
  android: ic_launcher
  image_path: assets/logo.png
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/logo_stors.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logo.png"
